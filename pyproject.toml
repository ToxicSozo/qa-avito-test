[tool.pytest.ini_options]
addopts = "-ra --tb=short --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
log_level = "INFO"
log_format = "%(levelname)s %(message)s"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
